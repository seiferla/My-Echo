# Dependabot-Konfiguration für myEcho.
# Alle Abhängigkeiten pro Ökosystem werden in EINEM wöchentlichen PR gebündelt —
# keine Flut von Einzel-PRs. Maximal 5 offene PRs insgesamt.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/mobile-app"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      all-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      all-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5