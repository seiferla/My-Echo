# Dependabot-Konfiguration für myEcho.
# Jede Abhängigkeit bekommt einen eigenen PR — kein Sammel-PR mehr.
# Ausnahme: die Expo-SDK-Pakete werden in EINER Gruppe gebündelt, da sie
# versionsgebunden sind (expo, expo-*, @expo/*, react, react-dom, react-native,
# react-native-screens, safe-area-context, svg, web) und nur zusammen funktionieren.
# Maximal 5 offene PRs insgesamt.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/mobile-app"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-screens"
          - "react-native-safe-area-context"
          - "react-native-svg"
          - "react-native-web"
    # Expo kodiert die SDK-Nummer als semver-Major (56.x -> 57.x = neues SDK).
    # Ein einzelnes @expo/*-Paket auf die nächste SDK-Zeile zu heben, zerreißt
    # den Stack: die anderen Pakete bleiben auf der alten Zeile, npm muss eine
    # zweite, nicht gepinnte Kopie auflösen, und `npm ci` bricht ab, sobald
    # deren Patch-Version driftet. Deshalb hier nur Patches automatisch.
    # SDK-Upgrades bewusst und komplett per `npx expo install expo@^57 --fix`.
    ignore:
      - dependency-name: "@expo/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "expo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "expo-*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
