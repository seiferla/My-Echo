# Dependabot config for myEcho.
# Every dependency gets its own PR — no more combined PR.
# Exception: the Expo SDK packages are bundled in ONE group, because their
# versions are tied together (expo, expo-*, @expo/*, react, react-dom, react-native,
# react-native-screens, safe-area-context, svg, web) and they only work together.
# At most 5 open PRs in total.
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/mobile-app"
    schedule:
      interval: "daily"
      day: "monday"
    groups:
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-native-screens"
          - "react-native-safe-area-context"
          - "react-native-svg"
          - "react-native-web"
    # Expo encodes the SDK number as the semver major (56.x -> 57.x = new SDK).
    # Moving a single @expo/* package to the next SDK line breaks the stack:
    # the other packages stay on the old line, npm must resolve a second,
    # unpinned copy, and `npm ci` fails as soon as its patch version drifts.
    # So only patches are automatic here.
    # Do SDK upgrades on purpose and completely with `npx expo install expo@^57 --fix`.
    ignore:
      - dependency-name: "@expo/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "expo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "expo-*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # react-native is tied to the SDK (SDK 57 -> RN 0.86.x) and linked by an
      # override to react-native-reanimated@4.5.3 (peer range 0.83-0.86).
      # A minor bump outside an SDK upgrade breaks `npm ci`.
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "daily"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/mobile-app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
