name: Android PR Build

# Builds the app on every PR that changes mobile-app/** — only as a smoke test.
#
# Goal: close exactly the gap that caused the JDK 25 incident.
# mobile-ci.yml only checks `npm ci` + `tsc`. Before, the real native Gradle
# build only ran AFTER the merge (android-merge-build.yml, push to main)
# or manually (android-release.yml). So a broken native build (e.g. Kotlin
# compiler errors from a JDK version that AGP/Kotlin does not support)
# always showed up on main first, never on the feature branch.
#
# On purpose NOT "the whole process" like android-merge-build.yml:
#   - no signing (no access to the release keystore needed)
#   - only assembleDebug, no bundleRelease/AAB
#   - no draft/GitHub release, no upload to a release
#   - shorter artifact retention (only meant for quick testing)
#
# JAVA_VERSION MUST match android-merge-build.yml and android-release.yml —
# otherwise this workflow tests a different combination than the one that is
# really released, and the gap from above opens again.
on:
  pull_request:
    # Only files that affect the NATIVE build. Pure JS/TS changes
    # (app/, components/, utils/ …) do not need a ~10 min Gradle run — mobile-ci.yml
    # checks them with tsc + JS bundle export in under a minute.
    # The workflow file itself is in the filter, otherwise a change to
    # this workflow would not test itself.
    paths:
      - "mobile-app/package.json"
      - "mobile-app/package-lock.json"
      - "mobile-app/app.json"
      - "mobile-app/plugins/**"
      - "mobile-app/patches/**"
      - "mobile-app/assets/**"
      - ".github/workflows/android-pr-build.yml"
      - ".github/scripts/**"

concurrency:
  group: android-pr-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"

jobs:
  build-debug:
    name: Build debug APK (smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Quality gate before the native build — saves a broken Gradle run
      # when the types are already wrong.
      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      # Prebuild cache: same key as android-merge-build.yml/android-release.yml,
      # so all three workflows share the cache instead of duplicating it.
      - name: Restore prebuild cache
        id: prebuild-cache
        uses: actions/cache/restore@v6
        with:
          path: mobile-app/android
          key: prebuild-${{ runner.os }}-${{ hashFiles('mobile-app/app.json', 'mobile-app/package-lock.json', 'mobile-app/plugins/**', 'mobile-app/patches/**', 'mobile-app/assets/**') }}

      - name: Expo prebuild (Android)
        if: steps.prebuild-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --no-install

      - name: Save prebuild cache
        if: steps.prebuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: mobile-app/android
          key: ${{ steps.prebuild-cache.outputs.cache-primary-key }}

      # Native build cache — same key as the other two workflows.
      - name: Cache native build outputs
        uses: actions/cache@v6
        with:
          path: |
            mobile-app/android/.gradle
            mobile-app/android/app/.cxx
          key: native-${{ runner.os }}-${{ hashFiles('mobile-app/package-lock.json', 'mobile-app/android/build.gradle', 'mobile-app/android/app/build.gradle') }}
          restore-keys: |
            native-${{ runner.os }}-

      # The debug build needs no signing keystore — withReleaseSigning.js
      # only changes the release buildType, debug stays untouched.
      - name: Gradle build (debug APK)
        working-directory: mobile-app/android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: ./gradlew assembleDebug --build-cache --parallel --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Upload debug APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: myecho-debug-${{ github.event.pull_request.head.sha }}
          path: mobile-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3
