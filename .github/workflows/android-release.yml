name: Android Release

# Builds the signed myEcho Android app on GitHub runners.
# The native android/ project is not in the repo. It is created fresh here
# with `expo prebuild` and then built with Gradle.
#
# Triggers:
#   - manual (workflow_dispatch), choose APK or AAB
#   - version tag v*.*.* -> build + GitHub release with the file attached
on:
  workflow_dispatch:
    inputs:
      format:
        description: "Build format"
        type: choice
        options: [apk, aab]
        default: apk
  push:
    tags: ["v*.*.*"]

# Only one run per branch/tag at a time; cancel older running builds.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to create a release for tags

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"

jobs:
  build-android:
    # Quality gate (typecheck) is the first step of this job —
    # saves the extra runner setup of a separate quality job.
    name: Build (${{ github.event.inputs.format || 'apk' }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    env:
      FORMAT: ${{ github.event.inputs.format || 'apk' }}
      # Backend URL of the shipped APK. Set it as a repository variable or secret
      # in the GitHub repo settings (Settings → Secrets and variables →
      # Variables). If the DHCP address changes: update it here and rebuild the APK.
      EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL || 'http://192.168.178.21:4444' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Quality gate before the expensive native build. Fails early if types are broken.
      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Determine version name
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
          fi

      # ----------------------------------------------------------------------
      # Prebuild cache:
      # `expo prebuild` is deterministic for app.json + lockfile +
      # config plugins + patches + assets (JS sources are not used). If none
      # of these changed, we skip generating the android/ folder completely.
      #
      # Important: restore and save are separate, so the keystore created
      # LATER (android/app/myecho.keystore) does NOT end up in the cache.
      # ----------------------------------------------------------------------
      - name: Restore prebuild cache
        id: prebuild-cache
        uses: actions/cache/restore@v6
        with:
          path: mobile-app/android
          key: prebuild-${{ runner.os }}-${{ hashFiles('mobile-app/app.json', 'mobile-app/package-lock.json', 'mobile-app/plugins/**', 'mobile-app/patches/**', 'mobile-app/assets/**') }}

      - name: Expo prebuild (Android)
        if: steps.prebuild-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --no-install

      - name: Save prebuild cache
        if: steps.prebuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: mobile-app/android
          key: ${{ steps.prebuild-cache.outputs.cache-primary-key }}

      # ----------------------------------------------------------------------
      # Native build cache:
      # Caches the expensive outputs of the Gradle/C++ build (Hermes, JSI, fbjni,
      # Kotlin compile cache). The keystore is not in these paths,
      # so it is safe to save.
      # ----------------------------------------------------------------------
      - name: Cache native build outputs
        uses: actions/cache@v6
        with:
          path: |
            mobile-app/android/.gradle
            mobile-app/android/app/.cxx
          key: native-${{ runner.os }}-${{ hashFiles('mobile-app/package-lock.json', 'mobile-app/android/build.gradle', 'mobile-app/android/app/build.gradle') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Set up signing keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Clean the secret: remove all whitespace (including line breaks).
          B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
          INVALID="$(printf '%s' "$B64" | tr -d 'A-Za-z0-9+/=' | wc -c | tr -d ' ')"
          # Diagnostics (prints only numbers, not the secret itself):
          echo "Diagnostics ANDROID_KEYSTORE_BASE64: length=${#B64} (expected ~3488), non-base64 chars=$INVALID (expected 0)"
          # Decode; --ignore-garbage skips foreign characters that were copied by mistake.
          printf '%s' "$B64" | base64 --decode --ignore-garbage > android/app/myecho.keystore 2>/dev/null || true
          # Sanity check: valid keystore with this password?
          if ! keytool -list -keystore android/app/myecho.keystore -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Invalid keystore. Probably ANDROID_KEYSTORE_BASE64 is incomplete (length ${#B64}, expected ~3488) or ANDROID_KEYSTORE_PASSWORD is wrong. Best set the secret from the file with 'gh secret set'."
            exit 1
          fi
          cat > android/keystore.properties <<EOF
          storeFile=myecho.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Gradle build
        working-directory: mobile-app/android
        env:
          # Version name from tag/app.json. The versionCode comes from the shared
          # script (see below), not from github.run_number.
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          # More heap for the Gradle daemon JVM. ubuntu-latest has 7 GB RAM;
          # 4 GB for Gradle prevents GC thrashing in large RN builds.
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          # Same formula as android-merge-build.yml (time-based, monotonic across
          # workflows) — separate run_number counters drifted apart.
          export ANDROID_VERSION_CODE=$("$GITHUB_WORKSPACE/.github/scripts/android-version-code.sh")
          echo "versionCode=$ANDROID_VERSION_CODE"

          # No --no-daemon: gradle/actions/setup-gradle manages the daemon
          # and saves ~10s of JVM startup per call.
          # --parallel: build modules in parallel (RN/Expo handles this in current versions).
          COMMON_FLAGS="--build-cache --parallel --stacktrace"
          if [ "$FORMAT" = "aab" ]; then
            # AAB for the store: all ABIs (Google delivers the right one per device).
            ./gradlew bundleRelease $COMMON_FLAGS
          else
            # APK for sideloading: only arm64-v8a (all modern phones) -> ~4x faster.
            ./gradlew assembleRelease $COMMON_FLAGS \
              -PreactNativeArchitectures=arm64-v8a
          fi

      - name: Find artifact path
        id: artifact
        working-directory: mobile-app/android
        run: |
          if [ "$FORMAT" = "aab" ]; then
            file=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          else
            file=$(ls app/build/outputs/apk/release/*.apk | head -1)
          fi
          echo "path=mobile-app/android/$file" >> "$GITHUB_OUTPUT"

      - name: Upload APK/AAB as artifact
        uses: actions/upload-artifact@v7
        with:
          name: myecho-${{ steps.version.outputs.name }}-${{ env.FORMAT }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.artifact.outputs.path }}
          generate_release_notes: true
