# Publishes ONLY the privacy policy on GitHub Pages.
# Everything else in docs/ stays out, because the build step reads only
# the two PRIVACY files.
#
# Result: https://seiferla.github.io/My-Echo/            (German)
#         https://seiferla.github.io/My-Echo/privacy-en.html  (English)
name: Pages (Privacy)

on:
  push:
    branches: [main]
    paths:
      - 'docs/PRIVACY.md'
      - 'docs/PRIVACY_EN.md'
      - 'scripts/build_privacy_site.py'
      - 'landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two parallel deployments would cancel each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install markdown
        run: pip install --disable-pip-version-check markdown==3.7

      - name: Build site
        run: python3 scripts/build_privacy_site.py site

      # Landing page under /app/. The privacy URLs (/ and /privacy-en.html)
      # stay the same, because they are linked e.g. in the Play Store.
      - name: Copy landing page
        run: cp -R landing site/app

      - name: Safety net — publish nothing internal
        run: |
          # Fails if internal details end up in the page by mistake.
          if grep -rniIE '192\.168\.|10\.[0-9]+\.|wireguard|keystore|SERVICE_ACCOUNT|API_KEY' site/; then
            echo "::error::Internal details found in the build — deployment cancelled."
            exit 1
          fi
          echo "OK — no internal details found."
          ls -la site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
