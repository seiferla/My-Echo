name: Android Merge Build

# Baut bei jedem Merge in main, der die App betrifft, automatisch eine APK
# und veröffentlicht sie als DRAFT-Release auf GitHub. So gibt es nach jedem
# Merge sofort eine installierbare APK (Sideload) zum Herunterladen.
#
# Unterschied zu android-release.yml:
#   - läuft automatisch (push auf main), nicht nur manuell oder per Tag
#   - baut NUR die APK (arm64-v8a). Das AAB für den Play Store (alle 4 ABIs,
#     mehrere Minuten C++-Compile extra) baut android-release.yml per Tag
#     oder manuell mit format=aab — es wird nicht nach jedem Merge gebraucht.
#   - erzeugt ein rollierendes DRAFT-Release (Tag "android-preview"),
#     das bei jedem Merge überschrieben wird — keine Tag-Flut
on:
  push:
    branches: [main]
    # Kein ~10-min-Build für README-, Backend- oder Docs-Merges.
    paths:
      - "mobile-app/**"
      - ".github/workflows/android-merge-build.yml"
      - ".github/scripts/**"

# Nur ein Lauf gleichzeitig. Bewusst NICHT abbrechen: ein abgebrochener Lauf
# speichert den Gradle-Cache nicht (Post-Step von setup-gradle läuft nie), und
# PR-Builds lesen genau diesen Cache von main. GitHub behält trotzdem nur den
# neuesten wartenden Lauf — bei mehreren schnellen Merges wird nicht jeder gebaut.
concurrency:
  group: android-merge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # nötig, um das Draft-Release zu erstellen/löschen

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"
  PREVIEW_TAG: android-preview

jobs:
  build-and-release:
    name: Build APK and publish draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    env:
      # Backend-URL der ausgelieferten APK (wie android-release.yml).
      EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL || 'http://192.168.178.21:4444' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Quality-Gate vor dem teuren nativen Build.
      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (mit Caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Versionsname bestimmen
        id: version
        run: echo "name=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      # Prebuild-Cache: android/-Ordner nur regenerieren, wenn sich app.json,
      # Lockfile, Config-Plugins, Patches oder Assets geändert haben. Reine JS-
      # Änderungen (app/**) ändern den generierten android/-Ordner nicht.
      - name: Restore prebuild cache
        id: prebuild-cache
        uses: actions/cache/restore@v6
        with:
          path: mobile-app/android
          key: prebuild-${{ runner.os }}-${{ hashFiles('mobile-app/app.json', 'mobile-app/package-lock.json', 'mobile-app/plugins/**', 'mobile-app/patches/**', 'mobile-app/assets/**') }}

      - name: Expo prebuild (Android)
        if: steps.prebuild-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --no-install

      - name: Save prebuild cache
        if: steps.prebuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: mobile-app/android
          key: ${{ steps.prebuild-cache.outputs.cache-primary-key }}

      # Native-Build-Cache für die teuren Gradle-/C++-Outputs.
      - name: Cache native build outputs
        uses: actions/cache@v6
        with:
          path: |
            mobile-app/android/.gradle
            mobile-app/android/app/.cxx
          key: native-${{ runner.os }}-${{ hashFiles('mobile-app/package-lock.json', 'mobile-app/android/build.gradle', 'mobile-app/android/app/build.gradle') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Signing-Keystore aus Secrets einrichten
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
          printf '%s' "$B64" | base64 --decode --ignore-garbage > android/app/myecho.keystore 2>/dev/null || true
          if ! keytool -list -keystore android/app/myecho.keystore -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore ungültig. ANDROID_KEYSTORE_BASE64 oder ANDROID_KEYSTORE_PASSWORD prüfen."
            exit 1
          fi
          cat > android/keystore.properties <<EOF
          storeFile=myecho.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Gradle-Build (APK)
        working-directory: mobile-app/android
        env:
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          # Gemeinsame Formel mit android-release.yml (zeitbasiert, workflow-
          # übergreifend monoton) — getrennte run_number-Zähler liefen auseinander.
          export ANDROID_VERSION_CODE=$("$GITHUB_WORKSPACE/.github/scripts/android-version-code.sh")
          echo "versionCode=$ANDROID_VERSION_CODE"

          # APK zum Sideloaden: nur arm64-v8a (alle modernen Phones) -> schneller.
          ./gradlew assembleRelease --build-cache --parallel --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Artefakt-Pfad ermitteln
        id: artifacts
        working-directory: mobile-app/android
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "apk=mobile-app/android/$apk" >> "$GITHUB_OUTPUT"

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: myecho-${{ steps.version.outputs.name }}
          path: ${{ steps.artifacts.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      # Rollierendes Draft-Release: altes Release + Tag entfernen, dann neu anlegen.
      - name: Altes Preview-Release zurücksetzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$PREVIEW_TAG" --yes 2>/dev/null || true
          git push origin --delete "$PREVIEW_TAG" 2>/dev/null || true

      - name: Draft-Release erstellen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.PREVIEW_TAG }}
          draft: true
          name: "Android Preview v${{ steps.version.outputs.name }}"
          body: |
            Automatisch aus `${{ github.sha }}` (Branch `main`) gebaut.

            - **APK** (arm64-v8a) zum Sideloaden

            AAB für den Play Store: Workflow „Android Release“ mit format=aab starten.

            Release finalisieren: Draft auf GitHub öffnen und „Publish release“.
          files: ${{ steps.artifacts.outputs.apk }}
          fail_on_unmatched_files: true
