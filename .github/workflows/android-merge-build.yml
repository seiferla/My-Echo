name: Android Merge Build

# On every merge to main that touches the app, builds an APK automatically
# and publishes it as a DRAFT release on GitHub. So after every merge there
# is an installable APK (sideload) to download right away.
#
# Difference to android-release.yml:
#   - runs automatically (push to main), not only manually or by tag
#   - builds ONLY the APK (arm64-v8a). The AAB for the Play Store (all 4 ABIs,
#     several extra minutes of C++ compile) is built by android-release.yml by tag
#     or manually with format=aab — it is not needed after every merge.
#   - creates a rolling DRAFT release (tag "android-preview")
#     that is overwritten on every merge — no flood of tags
on:
  push:
    branches: [main]
    # No ~10 min build for README, backend or docs merges.
    paths:
      - "mobile-app/**"
      - ".github/workflows/android-merge-build.yml"
      - ".github/scripts/**"

# Only one run at a time. On purpose NOT cancelled: a cancelled run does not
# save the Gradle cache (the setup-gradle post step never runs), and PR builds
# read exactly this cache from main. GitHub still keeps only the newest
# waiting run — with several quick merges, not every merge is built.
concurrency:
  group: android-merge-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # needed to create/delete the draft release

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"
  PREVIEW_TAG: android-preview

jobs:
  build-and-release:
    name: Build APK and publish draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    env:
      # Backend URL of the shipped APK (same as android-release.yml).
      EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL || 'http://192.168.178.21:4444' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Quality gate before the expensive native build.
      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Determine version name
        id: version
        run: echo "name=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      # Prebuild cache: only regenerate the android/ folder if app.json,
      # lockfile, config plugins, patches or assets changed. Pure JS
      # changes (app/**) do not change the generated android/ folder.
      - name: Restore prebuild cache
        id: prebuild-cache
        uses: actions/cache/restore@v6
        with:
          path: mobile-app/android
          key: prebuild-${{ runner.os }}-${{ hashFiles('mobile-app/app.json', 'mobile-app/package-lock.json', 'mobile-app/plugins/**', 'mobile-app/patches/**', 'mobile-app/assets/**') }}

      - name: Expo prebuild (Android)
        if: steps.prebuild-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --no-install

      - name: Save prebuild cache
        if: steps.prebuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: mobile-app/android
          key: ${{ steps.prebuild-cache.outputs.cache-primary-key }}

      # Native build cache for the expensive Gradle/C++ outputs.
      - name: Cache native build outputs
        uses: actions/cache@v6
        with:
          path: |
            mobile-app/android/.gradle
            mobile-app/android/app/.cxx
          key: native-${{ runner.os }}-${{ hashFiles('mobile-app/package-lock.json', 'mobile-app/android/build.gradle', 'mobile-app/android/app/build.gradle') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Set up signing keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
          printf '%s' "$B64" | base64 --decode --ignore-garbage > android/app/myecho.keystore 2>/dev/null || true
          if ! keytool -list -keystore android/app/myecho.keystore -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Invalid keystore. Check ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          cat > android/keystore.properties <<EOF
          storeFile=myecho.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Gradle build (APK)
        working-directory: mobile-app/android
        env:
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          # Same formula as android-release.yml (time-based, monotonic across
          # workflows) — separate run_number counters drifted apart.
          export ANDROID_VERSION_CODE=$("$GITHUB_WORKSPACE/.github/scripts/android-version-code.sh")
          echo "versionCode=$ANDROID_VERSION_CODE"

          # APK for sideloading: only arm64-v8a (all modern phones) -> faster.
          ./gradlew assembleRelease --build-cache --parallel --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Find artifact path
        id: artifacts
        working-directory: mobile-app/android
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "apk=mobile-app/android/$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v7
        with:
          name: myecho-${{ steps.version.outputs.name }}
          path: ${{ steps.artifacts.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      # Rolling draft release: remove the old release + tag, then create it again.
      - name: Reset old preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$PREVIEW_TAG" --yes 2>/dev/null || true
          git push origin --delete "$PREVIEW_TAG" 2>/dev/null || true

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.PREVIEW_TAG }}
          draft: true
          name: "Android Preview v${{ steps.version.outputs.name }}"
          body: |
            Built automatically from `${{ github.sha }}` (branch `main`).

            - **APK** (arm64-v8a) for sideloading

            AAB for the Play Store: run the "Android Release" workflow with format=aab.

            To finalize the release: open the draft on GitHub and click "Publish release".
          files: ${{ steps.artifacts.outputs.apk }}
          fail_on_unmatched_files: true
