name: Android Merge Build

# Baut bei jedem Merge in main automatisch APK + AAB und veröffentlicht
# beide als DRAFT-Release auf GitHub. So gibt es nach jedem Merge sofort
# eine installierbare APK (Sideload) und ein AAB (Store) zum Herunterladen.
#
# Unterschied zu android-release.yml:
#   - läuft automatisch (push auf main), nicht nur manuell oder per Tag
#   - baut BEIDE Formate in einem Lauf
#   - erzeugt ein rollierendes DRAFT-Release (Tag "android-preview"),
#     das bei jedem Merge überschrieben wird — keine Tag-Flut
on:
  push:
    branches: [main]

# Nur ein Lauf gleichzeitig; ein neuer Merge bricht einen noch laufenden Build ab.
concurrency:
  group: android-merge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # nötig, um das Draft-Release zu erstellen/löschen

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "17"
  PREVIEW_TAG: android-preview

jobs:
  build-and-release:
    name: Build APK + AAB and publish draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    env:
      # Backend-URL der ausgelieferten APK/AAB (wie android-release.yml).
      EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL || 'http://192.168.178.21:4444' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Quality-Gate vor dem teuren nativen Build.
      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (mit Caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Versionsname bestimmen
        id: version
        run: echo "name=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      # Prebuild-Cache: android/-Ordner nur regenerieren, wenn sich app.json,
      # Lockfile oder App-Sourcen geändert haben.
      - name: Restore prebuild cache
        id: prebuild-cache
        uses: actions/cache/restore@v6
        with:
          path: mobile-app/android
          key: prebuild-${{ runner.os }}-${{ hashFiles('mobile-app/app.json', 'mobile-app/package-lock.json', 'mobile-app/app/**', 'mobile-app/assets/**') }}

      - name: Expo prebuild (Android)
        if: steps.prebuild-cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --no-install

      - name: Save prebuild cache
        if: steps.prebuild-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: mobile-app/android
          key: ${{ steps.prebuild-cache.outputs.cache-primary-key }}

      # Native-Build-Cache für die teuren Gradle-/C++-Outputs.
      - name: Cache native build outputs
        uses: actions/cache@v6
        with:
          path: |
            mobile-app/android/.gradle
            mobile-app/android/app/.cxx
            mobile-app/node_modules/react-native/ReactAndroid/build
          key: native-${{ runner.os }}-${{ hashFiles('mobile-app/package-lock.json', 'mobile-app/android/build.gradle', 'mobile-app/android/app/build.gradle') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Signing-Keystore aus Secrets einrichten
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          B64="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
          printf '%s' "$B64" | base64 --decode --ignore-garbage > android/app/myecho.keystore 2>/dev/null || true
          if ! keytool -list -keystore android/app/myecho.keystore -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Keystore ungültig. ANDROID_KEYSTORE_BASE64 oder ANDROID_KEYSTORE_PASSWORD prüfen."
            exit 1
          fi
          cat > android/keystore.properties <<EOF
          storeFile=myecho.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Gradle-Build (APK + AAB)
        working-directory: mobile-app/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          COMMON_FLAGS="--build-cache --parallel --stacktrace"
          # APK zum Sideloaden: nur arm64-v8a (alle modernen Phones) -> schneller.
          ./gradlew assembleRelease $COMMON_FLAGS -PreactNativeArchitectures=arm64-v8a
          # AAB für den Store: alle ABIs.
          ./gradlew bundleRelease $COMMON_FLAGS

      - name: Artefakt-Pfade ermitteln
        id: artifacts
        working-directory: mobile-app/android
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          aab=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          echo "apk=mobile-app/android/$apk" >> "$GITHUB_OUTPUT"
          echo "aab=mobile-app/android/$aab" >> "$GITHUB_OUTPUT"

      - name: APK + AAB als Artefakte hochladen
        uses: actions/upload-artifact@v7
        with:
          name: myecho-${{ steps.version.outputs.name }}
          path: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.aab }}
          if-no-files-found: error
          retention-days: 14

      # Rollierendes Draft-Release: altes Release + Tag entfernen, dann neu anlegen.
      - name: Altes Preview-Release zurücksetzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$PREVIEW_TAG" --yes 2>/dev/null || true
          git push origin --delete "$PREVIEW_TAG" 2>/dev/null || true

      - name: Draft-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PREVIEW_TAG }}
          draft: true
          name: "Android Preview v${{ steps.version.outputs.name }}"
          body: |
            Automatisch aus `${{ github.sha }}` (Branch `main`) gebaut.

            - **APK** (arm64-v8a) zum Sideloaden
            - **AAB** (alle ABIs) für den Play Store

            Release finalisieren: Draft auf GitHub öffnen und „Publish release“.
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.aab }}
          fail_on_unmatched_files: true
