name: Mobile CI

# Fast check for the Expo app on every change in mobile-app/.
#
# Goal: catch dependency problems early — BEFORE the merge and before the
# expensive native build in android-release.yml (runs only manually or on tags).
# `npm ci` fails as soon as package.json and package-lock.json are out of sync.
# A Dependabot PR brought exactly this to main unnoticed
# (@expo/metro-runtime on the SDK 57 line while the rest stayed on SDK 56).
on:
  pull_request:
    paths: ["mobile-app/**"]
  push:
    branches: [main]
    paths: ["mobile-app/**"]

# Only one run per branch at a time; cancel older runs.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # MUST match android-release.yml. Different Node versions come with
  # different npm versions, which check lockfiles with different strictness.
  # With a different version here, this check could be green
  # while the release build is still red.
  NODE_VERSION: "24"

jobs:
  check:
    name: Install & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      # The real gatekeeper: fails if the lockfile does not match
      # package.json.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      # Unit tests for the sync logic (chats, phrases, TTS stats, login storage).
      - name: Unit tests
        run: npm test -- --ci

      # Replaces the native build for pure JS changes (android-pr-build.yml
      # does not run then): Metro bundles the JS just like the Gradle build. It catches
      # broken imports, missing modules and Babel errors in seconds instead of minutes.
      - name: JS bundle export (Android)
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-export"
