name: Backend Tests

on:
  push:
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # The data tests run against a real Postgres (schema from supabase/migrations).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install backend dependencies
        working-directory: backend
        run: uv pip install --system -r requirements.txt pytest

      - name: Run backend tests with coverage
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          pytest --cov --cov-report=term-missing --cov-report=json
          COVERAGE=$(python3 -c "import json; d=json.load(open('coverage.json')); print(int(d['totals']['percent_covered_display']))")
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV

      - name: Run load test unit tests
        run: |
          uv pip install --system -r loadtest/requirements.txt
          pytest loadtest

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ secrets.GIST_ID }}
          filename: myecho-coverage.json
          label: coverage
          message: ${{ env.COVERAGE }}%
          valColorRange: ${{ env.COVERAGE }}
          maxColorRange: 100
          minColorRange: 0
