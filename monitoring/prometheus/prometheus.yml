global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "myecho-backend"
    static_configs:
      - targets: ["__BACKEND_HOST__:4444"]
    metrics_path: "/metrics"
    # /metrics ist geschützt: gleicher Wert wie METRICS_TOKEN im Backend.
    # __METRICS_TOKEN__ wird beim Start aus der Umgebung eingesetzt (docker-compose.yml).
    authorization:
      type: Bearer
      credentials: "__METRICS_TOKEN__"
