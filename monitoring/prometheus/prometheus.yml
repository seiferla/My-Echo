global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "myecho-backend"
    static_configs:
      - targets: ["__BACKEND_HOST__:4444"]
    metrics_path: "/metrics"
    # Same value as METRICS_TOKEN in the backend; filled in at start (docker-compose.yml).
    authorization:
      type: Bearer
      credentials: "__METRICS_TOKEN__"
