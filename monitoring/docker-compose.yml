services:
  prometheus:
    image: prom/prometheus:latest
    container_name: myecho-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    environment:
      - BACKEND_HOST=${BACKEND_HOST:-192.168.178.21}
      - METRICS_TOKEN=${METRICS_TOKEN:?METRICS_TOKEN must be set}
    # Fills __BACKEND_HOST__ and __METRICS_TOKEN__ into the config template,
    # then starts Prometheus with the generated config.
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        sed -e "s/__BACKEND_HOST__/$${BACKEND_HOST}/g" \
            -e "s/__METRICS_TOKEN__/$${METRICS_TOKEN}/g" \
          /etc/prometheus/prometheus.yml > /tmp/prometheus.yml && \
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=90d \
          --web.console.libraries=/usr/share/prometheus/console_libraries \
          --web.console.templates=/usr/share/prometheus/consoles

  grafana:
    image: grafana/grafana:latest
    container_name: myecho-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Named volume — dashboards, settings and passwords are kept
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://${BACKEND_HOST:-192.168.178.21}:3001"

volumes:
  prometheus_data:
  grafana_data:
