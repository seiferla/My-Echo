# SonarQube Cloud config: what the scanner analyzes.
# The scan runs in GitHub Actions (.github/workflows/sonar.yml).

sonar.organization=fibo-dhbw
sonar.projectKey=seiferla_My-Echo
sonar.projectName=myEcho

# This project uses the "new analysis scope": sonar.sources, sonar.tests and
# sonar.test.inclusions have no effect. Sonar analyzes the whole project and
# guesses test files from their name (test_*.py, *.test.ts, __tests__/).
sonar.exclusions=**/node_modules/**,**/__pycache__/**,backend/scripts/**

# Test code is not measured for coverage: test files and the shared test fakes
# in mobile-app/test/. Without this, every new test helper counts as new code
# with low coverage and fails the quality gate.
sonar.coverage.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/test_*.py,**/testutils.py,mobile-app/test/**

# Coverage reports, written by the test steps in sonar.yml
sonar.python.version=3.14
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=mobile-app/coverage/lcov.info
