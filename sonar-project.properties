# SonarQube Cloud config: what the scanner analyzes.
# Organization and project key come from GitHub repo variables
# (see .github/workflows/sonar.yml), so they are not in this file.

sonar.projectName=myEcho

# Source code (backend + mobile app)
sonar.sources=backend,mobile-app/app,mobile-app/components,mobile-app/context,mobile-app/hooks,mobile-app/utils
sonar.exclusions=**/node_modules/**,**/__pycache__/**,backend/scripts/**

# Tests: count as tests, not as uncovered source code
sonar.tests=backend,mobile-app/utils
sonar.test.inclusions=backend/test_*.py,backend/testutils.py,mobile-app/**/__tests__/**

# Coverage reports, written by the test steps in sonar.yml
sonar.python.version=3.14
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=mobile-app/coverage/lcov.info
