services:
  backend:
    image: ghcr.io/seiferla/myecho-backend:latest
    container_name: myecho-backend
    restart: unless-stopped
    ports:
      - "4444:4444"
    environment:
      TTS_API_KEY: ${TTS_API_KEY}
      TTS_PROVIDER: ${TTS_PROVIDER:-fish}
      MOCK_TTS_FIRST_AUDIO_MS: ${MOCK_TTS_FIRST_AUDIO_MS:-1500}
      MOCK_TTS_CHUNK_MS: ${MOCK_TTS_CHUNK_MS:-20}
      MOCK_TTS_CHARS_PER_SECOND: ${MOCK_TTS_CHARS_PER_SECOND:-15}
      TTS_MODEL: ${TTS_MODEL:-s2-pro}
      TTS_VOICE: ${TTS_VOICE:-}
      TTS_LATENCY: ${TTS_LATENCY:-balanced}
      TTS_CHUNK_LENGTH: ${TTS_CHUNK_LENGTH:-50}
      SUPABASE_URL: ${SUPABASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4444/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
