services:
  backend:
    # Built from the cloned repo: the GHCR image is arm64 only (Raspberry Pi) and comes from main.
    build:
      context: ../backend
    container_name: myecho-backend
    restart: unless-stopped
    # No public port: only Caddy can reach the backend (inside the Docker network).
    expose:
      - "4444"
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4444/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2
    container_name: myecho-caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # keeps the TLS certificates
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
